experiment_name: {{AIR_JOB_LABEL}}   # AI Runtime task key; alphanumerics, - and _ only

environment:
  version: '{{ENV_VERSION}}'          # quoted string; base env provides torch + CUDA
  dependencies:                      # never list torch: it comes with the environment
{{DEPENDENCIES}}

compute:
  num_accelerators: {{NUM_GPUS}}
  accelerator_type: {{GPU_TYPE}}

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  cd $CODE_SOURCE_PATH
{{PRE_COMMAND}}  python train_reason_finetune.py --config finetune_config.yml

timeout_minutes: {{TIMEOUT}}
max_retries: 0
